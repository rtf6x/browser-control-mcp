services:
  browser-control-mcp:
    build: .
    image: browser-control-mcp
    container_name: browser-control-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8089"
      - "127.0.0.1:8090:8090"
    environment:
      EXTENSION_SECRET: ${EXTENSION_SECRET:?Set EXTENSION_SECRET in .env}
      EXTENSION_PORT: "8089"
      MCP_HTTP_PORT: "8090"
      CONTAINERIZED: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
